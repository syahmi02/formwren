name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      - run: pnpm check

      # The test suites below run even when an earlier one fails, so one failure doesn't hide the others.

      # The browser tests use Playwright's own Chromium on CI (N-8). The cache saves the download, and the install step adds the system libraries.
      - name: Restore the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and its system libraries
        id: chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Demo browser tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: pnpm e2e

      - name: Designer browser tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: pnpm e2e:designer

      # The extension tests run VS Code, so they need a display, which xvfb provides.
      # The key includes the engines range, so a new VS Code requirement starts with an empty cache.
      # The test script downloads this copy itself when the cache is empty.
      - name: Restore the VS Code test copy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/vscode/package.json') }}

      - name: Install xvfb
        id: xvfb
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run the extension tests under xvfb
        if: ${{ !cancelled() && steps.xvfb.outcome == 'success' }}
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm vscode:test

      - name: Upload the Playwright reports and output on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            apps/demo/e2e/.output/
            packages/designer/e2e/.output/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
