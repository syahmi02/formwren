name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # The browser tests use Playwright's own Chromium on CI (N-8). The cache saves the download, and the install step adds the system libraries.
      - name: Restore the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - run: pnpm e2e:designer

      # The extension tests run VS Code, so they need a display, which xvfb provides.
      # The key includes the engines range, so a new VS Code requirement starts with an empty cache.
      - name: Restore the VS Code test copy
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/vscode/package.json') }}

      # Downloads the same VS Code copy that the test script would download, so the script finds it on a clean checkout.
      - name: Fetch the VS Code test copy
        run: |
          node --input-type=module -e "import { resolve } from 'node:path'; import { download } from '@vscode/test-electron'; console.log(await download({ cachePath: resolve('.vscode-test'), extensionDevelopmentPath: resolve('apps/vscode') }));"

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run the extension tests under xvfb
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm vscode:test

      - name: Upload the Playwright reports and output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            apps/demo/e2e/.output/
            packages/designer/e2e/.output/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
